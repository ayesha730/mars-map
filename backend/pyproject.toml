[project]
name = "arespath-backend"
version = "0.1.0"
description = "NASA Space Apps 2026 AresPath Backend"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "rasterio>=1.4.0",
    "numpy",
    "affine",
    "pillow",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["app"]
asyncio_mode = "auto"
